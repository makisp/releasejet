# ReleaseJet Configuration
# Copy to .releasejet.yml and customize for your project.
# Or run: releasejet init

# Optional. Overrides the project name shown in notification cards.
# When unset, derived from the last path segment of projectUrl (e.g., https://github.com/acme/repo → "repo").
# projectName: "Test Project"

# Provider settings
# provider:
#   type: github          # or "gitlab"
#   url: https://github.com

# Tag format — how your git tags are structured
# Use {version} for the semver part and {prefix} for multi-client prefixes.
# Default: "v{version}" (single-client) or "{prefix}-v{version}" (multi-client)
# Examples: "{version}", "release/v{version}", "{prefix}/{version}", "{prefix}@{version}"
tagFormat: "v{version}"

# Client definitions (omit for single-client repos)
# clients:
#   - prefix: mobile
#     label: MOBILE
#   - prefix: web
#     label: WEB

# Category label mappings
# Key: the label name in your provider
# Value: the section heading in release notes
categories:
  feature: "New Features"
  bug: "Bug Fixes"
  improvement: "Improvements"
  breaking-change: "Breaking Changes"

# How to handle uncategorized issues
# "lenient" — include under "Other" with a warning (default)
# "strict" — fail release generation
uncategorized: lenient

# Issue/PR description rendering:
#   none    — title only (default; no change from previous releases)
#   extract — F4: render the cleaned first paragraph of each issue/PR body
#             under its title, truncated to ~200 chars.
#   ai      — Pro M3a: replace mechanical extraction with one-sentence AI
#             summaries per issue. Treated as "none" in core when
#             ai.allowDataEgress is unset. See https://releasejet.dev/docs/pro/ai.
description: none

# Release notes template
# "default"      — built-in template (free)
# <pro-name>     — named template from @releasejet/pro (e.g. "compact")
# ./my.hbs       — path to a custom Handlebars file (requires @releasejet/pro)
template: default

# Contributors section in release notes (disabled by default)
# contributors:
#   enabled: true
#   exclude:
#     - dependabot
#     - renovate

# Internal-only labels — issues with any of these are dropped from release notes.
# Useful for refactors, cleanups, internal-only chores that should not appear
# in client-facing notes.
# excludeLabels: [internal, chore]

# Pro feature — webhook notifications on successful `generate --publish`.
# Requires @releasejet/pro to be installed and a valid license.
#
# Each entry configures one channel. You can list multiple entries of the same type
# (e.g., post to two different Slack channels). webhookUrl MUST be an environment
# variable reference — literal URLs are rejected at config-load time.
#
# Supported types: slack, discord, teams (Power Automate workflow URL; legacy
# Office 365 connectors are deprecated).
#
# Each entry can optionally include a Handlebars `template` to override the
# default Pro message body. Templates are platform-native — write Slack mrkdwn
# for Slack, Discord markdown for Discord, basic markdown for Teams. Handlebars
# {{...}} syntax and literal ${...} are both preserved verbatim (no env-var
# expansion runs on `template`). See README "Custom notification templates".
#
# notifications:
#   - type: slack
#     enabled: true
#     webhookUrl: ${SLACK_WEBHOOK_URL}
#     # includeAiSummary: false   # uncomment to suppress the AI release overview block on this channel (Pro M3.1+)
#     template: |
#       :rocket: *{{projectName}}* {{title}} is out
#       {{#if hasBreaking}}<!channel> :warning: Breaking changes in this release{{/if}}
#       • Features: {{categoryCount "New Features"}}
#       • Fixes: {{categoryCount "Bug Fixes"}}
#       <{{releaseUrl}}|See full release notes>
#
#   - type: discord
#     enabled: false
#     webhookUrl: ${DISCORD_WEBHOOK_URL}
#     # template omitted — uses the default Pro M2 Discord message.
#
#   - type: teams
#     enabled: false
#     webhookUrl: ${TEAMS_WORKFLOW_URL}
#
#   # M4: Generic outbound webhook for arbitrary endpoints.
#   # Pro feature. Use this for Zapier, n8n, status pages, internal services,
#   # or any tool that consumes a structured JSON payload.
#   # See: https://releasejet.dev/docs/notifications/webhooks
#   - type: webhook
#     enabled: false
#     # The receiver URL. Any http(s) endpoint. Move secrets to env vars.
#     url: ${MY_WEBHOOK_URL}
#     # Optional HMAC-SHA256 secret. If set, the body is signed and sent as
#     # X-ReleaseJet-Signature: sha256=<hex>. Receivers verify against the raw body.
#     # secret: ${MY_WEBHOOK_SECRET}
#     # Required, non-empty. Subscribe to one or both events.
#     events:
#       # - release.generated   # fires after every successful generate (with or without --publish)
#       - release.published     # fires after --publish succeeds
#     # Optional custom headers. ${VAR} expansion supported on values.
#     # X-ReleaseJet-* and Content-Type are reserved.
#     # headers:
#     #   Authorization: "Bearer ${MY_API_TOKEN}"
#     #   X-Tenant: acme

# Optional — Jira ticket linking (F3). When configured, ReleaseJet scans
# issue/PR titles and bodies for ticket IDs matching one of the listed
# project keys, and renders them inline as clickable links next to each
# issue line in the release notes.
#
# baseUrl can be a literal URL or an ${ENV_VAR} reference.
#
# jira:
#   baseUrl: https://acme.atlassian.net
#   projects: [PROJ, BUG]

# AI-powered descriptions and release overview (Pro M3).
# Sends issue titles, bodies, and labels to releasejet.dev for summarisation.
# See https://releasejet.dev/docs/pro/ai

# ai:
#   allowDataEgress: true

# description: ai           # M3a — replaces extract with one-sentence AI summary per issue
# aiSummary:
#   enabled: true           # M3b — adds 2–3 sentence release overview at the top
